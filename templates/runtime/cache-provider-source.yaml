    type: number
    min: 1
    step: 1
  l2_adapter_flag: --l2-adapter
  l2_backends:
    xdfs:
      display_name: XSKY MeshFusion Store
      icon: /static/catalog_icons/xsky.png
      adapter_flag_optional: true
      adapter_flag_default: false
      adapter_flag_label:
        default: Enable L2 Adapter Flag
        zh-CN: 启用 L2 适配器参数
      description:
        default: XSKY MeshFusion Store distributed storage as the L2 tier; capacity
          and durability scale with the external storage cluster.
        zh-CN: 企业级 KV Cache 扩展加速方案，激活 GPU 节点本地 DRAM 与 SSD 加速模型推理。基于端到端的 NVMe 技术，提供跨节点共享、本地优先读写、自动淘汰策略、主动保护
          SSD 寿命等多种能力。
      adapter_type: nixl_store_dynamic
      adapter_backend: XDFS_KV
      adapter_params:
        conf: conf
        params_file: params_file
        tenant_id: tenant_id
        max_capacity_gb: max_capacity_gb
      fields:
      - name: tenant_id
        label:
          default: Tenant ID
          zh-CN: 租户 ID
        default: nixl
  common_parameters:
  - --l2-adapter
  - --coordinator-url
  - --p2p-advertise-url
  - --separate-object-groups
  - --max-workers
  - --max-gpu-workers
  - --max-cpu-workers
  - --hash-algorithm
  - --enable-segmented-prefix
  - --shm-name
  - --worker-reap-timeout-seconds
  - --worker-registration-grace-seconds
  - --l1-use-lazy
  - --l1-init-size-gb
  - --l1-align-bytes
  - --l1-read-ttl-seconds
  - --l1-write-ttl-seconds
  - --gds-l1-path
  - --gds-l1-use-direct-io
  - --l1-devdax-path
  - --l2-store-policy
  - --l2-prefetch-policy
  - --l2-prefetch-max-in-flight
  - --metrics-sample-rate
  - --disable-metrics
  - --disable-logging
  - --disable-observability
  - --enable-tracing
  - --otlp-endpoint
  - --event-bus-queue-size
  - --trace-level
  - --trace-output
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store:
        histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second
      l0_l1_load:
        histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second
      l2_store:
        histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second
      l2_load:
        histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second
  inference_backend_integrations:
  - backend: vLLM
    frameworks:
    - cuda
    versions: '>=0.25.0'
    injection:
      env:
        PYTHONHASHSEED: '0'
      locality_params:
        node_local:
          mp_transfer_mode: auto
      kv_transfer_config:
        kv_connector: LMCacheMPConnector
        kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
        kv_role: kv_both
        kv_connector_extra_config:
          lmcache.mp.host: tcp://{{host}}
          lmcache.mp.port: '{{port}}'
          lmcache.mp.mp_transfer_mode: '{{mp_transfer_mode}}'
      args:
      - --shutdown-timeout
      - '20'
  - backend: vLLM
    frameworks:
    - cann
    versions: '>=0.25.0'
    injection:
      env:
        PYTHONHASHSEED: '0'
      locality_params:
        node_local:
          mp_transfer_mode: engine_driven
      kv_transfer_config:
        kv_connector: LMCacheMPConnector
        kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
        kv_role: kv_both
        kv_connector_extra_config:
          lmcache.mp.host: tcp://{{host}}
          lmcache.mp.port: '{{port}}'
          lmcache.mp.mp_transfer_mode: '{{mp_transfer_mode}}'
      args:
      - --shutdown-timeout
      - '20'
  - backend: SGLang
    frameworks:
    - cuda
    versions: '>=0.5.13'
    injection:
      env:
        PYTHONHASHSEED: '0'
      args:
      - --enable-lmcache
      - --lmcache-config-file
      - /tmp/gpustack-lmcache-sgl.yaml
      files:
        /tmp/gpustack-lmcache-sgl.yaml: 'mp_host: "{{host}}"

          mp_port: {{port}}

          '
